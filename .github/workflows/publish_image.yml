name: Publish Neron Image to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ComfyUI-NeronImage/pyproject.toml"

permissions:
  issues: write

jobs:
  publish-image:
    name: Publish 🖼 Neron Image
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'neron5480-cell' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install comfy-cli
        run: pip install comfy-cli
      - name: Publish only the Neron Image folder
        working-directory: ComfyUI-NeronImage
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token ${{ secrets.REGISTRY_ACCESS_TOKEN }}
