<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neron Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: «рабочий стол» — сетка плиток 12 колонок; плитки тянутся, растягиваются, удаляются, «⊞ Выровнять» убирает дыры.
   Вид: спокойный и светлый — иконка, название и одна понятная строка «что делает». Тёмные темы — в «🎨 Тема». */
:root {
  /* по умолчанию — «Светлый Neron»: серо-белый с лёгкой синевой, спокойный и читаемый */
  --ink: #e9ecef;          /* фон стола */
  --panel: #f8f9fa;        /* плитка */
  --panel-2: #f1f3f5;      /* полосы, кнопки */
  --line: #d5dae0;         /* рамки */
  --bronze: #2f5d8a;       /* акцент */
  --gold: #24496d;         /* заголовки и главное */
  --ember: #2f5d8a;
  --text: #1d232a;
  --muted: #5a6470;
  --ok: #2e8b47;
  --alpha: #b8660a;
  --soon: #6b7785;
  --well: #ffffff;
  --halo: #f4f6f8;
  --acc-soft: color-mix(in srgb, var(--bronze) 13%, var(--panel));
  --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 4px 14px rgba(20, 30, 45, .06);
  --f-display: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --gap: 12px;
  --row: 96px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 700px at 70% -10%, var(--halo) 0%, transparent 60%) fixed, var(--ink);
  color: var(--text);
  font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

/* ---------- свой фон: фото / гифка / видео на весь экран ---------- */
:root { --bgdim: .45; --bgblur: 0px; --tileop: 82%; }
.bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-layer img, .bg-layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(var(--bgblur)); transform: scale(1.04); }
.bg-dim { position: absolute; inset: 0; background: var(--ink); opacity: var(--bgdim); }
.bar, .hint, .desk { position: relative; z-index: 1; }
.has-bg .tile { background: color-mix(in srgb, var(--panel) var(--tileop), transparent); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2); }
.has-bg .crumbs, .has-bg .seg, .has-bg .tool, .has-bg .report { background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(8px); }
.has-bg .hint { color: var(--text); text-shadow: 0 1px 3px rgba(0, 0, 0, .6); }
.drawer h3 { margin: 14px 0 6px; font: 600 13px var(--f-body); color: var(--text); }
.row2 { display: flex; gap: 6px; flex-wrap: wrap; }
.row2 button { flex: 1; min-width: 120px; }
.colors { margin-top: 8px; }
.drawer label.item.color { display: flex; flex: 1; min-width: 130px; gap: 8px; align-items: center; padding: 7px 10px; margin-top: 6px; cursor: pointer;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: 500 13px var(--f-body); }
.drawer label.item.color:hover { border-color: var(--bronze); }
.item.color input { width: 30px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--bronze); }
.desk.drop { outline: 2px dashed var(--gold); outline-offset: 6px; border-radius: 14px; }

/* ---------- верхняя полоса ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.coin {
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--bronze); box-shadow: var(--shadow);
  font: 700 20px var(--f-display); color: var(--panel);
}
.brand h1 { margin: 0; font: 700 22px/1 var(--f-display); letter-spacing: .06em; color: var(--text); text-wrap: balance; }
.brand small { display: block; font: 500 12px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.crumbs, .seg { display: flex; align-items: center; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); flex-wrap: wrap; min-width: 0; }
.crumbs .sep { color: var(--muted); padding: 0 2px; }
.crumbs button[aria-current="page"] { color: var(--text); cursor: default; }
.crumbs .back { color: var(--text); border: 1px solid var(--line); }
.seg button { font: 600 12px var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 6px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { color: var(--panel); background: var(--bronze); }
.crumbs button, .tool {
  font: 600 13px var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px;
  padding: 7px 12px; cursor: pointer;
}

.tools { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.tool { border: 1px solid var(--line); background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
.tool:hover, .crumbs button:not([aria-current]):hover, .seg button:not([aria-pressed="true"]):hover { color: var(--bronze); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 13px; margin: -4px 0 18px; max-width: 900px; }

/* ---------- стол ---------- */
.desk { position: relative; width: 100%; min-height: 200px; }
.tile {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow);
  transition: left .28s cubic-bezier(.2, .8, .2, 1), top .28s cubic-bezier(.2, .8, .2, 1),
              width .28s cubic-bezier(.2, .8, .2, 1), height .28s cubic-bezier(.2, .8, .2, 1), opacity .25s, filter .25s;
}
.tile.dragging, .tile.resizing { transition: none; z-index: 20; box-shadow: 0 16px 40px rgba(20, 30, 45, .22), 0 0 0 1px var(--bronze); }
.desk { perspective: 1400px; }
/* вкладка: нужные плитки «выезжают» вперёд, остальные уходят вглубь */
.tile { transition-property: left, top, width, height, opacity, filter, transform; transition-duration: .55s, .55s, .28s, .28s, .45s, .45s, .55s; }
.tile.back { opacity: .32; filter: blur(1.6px) saturate(.35); transform: translateZ(-140px) scale(.94); z-index: 0; }
.tile.front { z-index: 2; transform: translateZ(0) scale(1); }
.tile.pop { animation: pop .35s ease-out both; }
@keyframes pop { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
.tile.back .head { cursor: default; }
.tile.back .grip { display: none; }
.tile:hover { border-color: var(--line2, color-mix(in srgb, var(--bronze) 35%, var(--line))); box-shadow: 0 2px 4px rgba(20, 30, 45, .06), 0 10px 26px rgba(20, 30, 45, .1); }
.head { display: flex; align-items: center; gap: 14px; padding: 14px 12px 4px 18px; cursor: grab; user-select: none; touch-action: none; }
.tile.dragging .head { cursor: grabbing; }
.ico { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--acc-soft); color: var(--bronze); }
.ico svg { width: 24px; height: 24px; }
.ico.sm { width: 30px; height: 30px; border-radius: 8px; }
.ico.sm svg { width: 18px; height: 18px; }
.title { font: 650 18px/1.25 var(--f-body); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.chip { font: 600 11px var(--f-body); letter-spacing: .04em; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; flex: none; }
.count { font-size: 13px; color: var(--muted); }
.chip.ok { color: var(--ok); } .chip.alpha { color: var(--alpha); } .chip.soon { color: var(--soon); }
.x { flex: none; align-self: flex-start; width: 24px; height: 24px; opacity: 0; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.tile:hover .x, .x:focus-visible { opacity: 1; }
.x:hover { background: color-mix(in srgb, #c0392b 12%, transparent); color: #c0392b; }
.foot { display: flex; align-items: center; gap: 10px; padding: 6px 12px 8px 18px; min-width: 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); margin: 0 0 0; }
.meta { flex: 1; min-height: 0; margin: 2px 18px 6px 74px; font: 400 14px/1.42 var(--f-body); color: var(--muted); overflow: hidden; }
.open { flex: none; margin-left: auto; font: 600 13.5px var(--f-body); color: var(--bronze); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.open:hover { background: var(--acc-soft); border-color: color-mix(in srgb, var(--bronze) 30%, transparent); }
.tile[data-status="soon"] .open, .tile.missing .open { background: transparent; color: var(--soon); border: 1px solid var(--line); }
.tile[data-status="soon"] .ico { color: var(--soon); background: var(--panel-2); }
.open[aria-busy="true"] { opacity: .6; cursor: progress; }
.grip { position: absolute; right: 2px; bottom: 2px; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; opacity: 0; }
.grip::before { content: ""; position: absolute; right: 4px; bottom: 4px; width: 9px; height: 9px;
  border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); border-radius: 0 0 3px 0; }
.tile:hover .grip { opacity: 1; }
.tile:hover .grip::before { border-color: var(--muted); }
.ghost { position: absolute; border: 2px dashed var(--bronze); border-radius: 14px; background: color-mix(in srgb, var(--bronze) 8%, transparent); pointer-events: none; z-index: 1; transition: left .12s, top .12s, width .12s, height .12s; }

/* ---------- ящик «＋ Плитка» и тост ---------- */
.drawer { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px));
  width: min(340px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; padding: 14px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(20, 30, 45, .18); }
.drawer h2 { margin: 0 0 4px; font: 650 17px var(--f-display); color: var(--text); }
.drawer p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
.drawer button.item { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; margin-top: 6px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: 500 13px var(--f-body); cursor: pointer; }
.drawer button.item:hover { border-color: var(--bronze); }
.swatch { display: inline-flex; gap: 3px; flex: none; }
.swatch i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.drawer button.item[aria-pressed="true"] { border-color: var(--gold); }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: #2a1c12; border: 1px solid var(--bronze);
  box-shadow: 0 12px 30px rgba(20, 30, 45, .2); font-size: 13px; max-width: calc(100vw - 32px); color: var(--text); background: var(--panel-2); }
.toast button { font: 600 12px var(--f-body); background: var(--bronze); color: var(--panel); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
/* ---------- ✉ написать создателю (папка «Тест») ---------- */
.report { position: relative; z-index: 1; margin-top: 22px; padding: 16px; border-radius: 14px; border: 1px solid var(--alpha);
  background: var(--panel); box-shadow: var(--shadow); max-width: 900px; }
.report h2 { margin: 0 0 4px; font: 650 19px var(--f-display); color: var(--text); }
.report p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.rp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.report label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.report .rp-wide { margin-top: 10px; }
.report select, .report input:not([type="checkbox"]), .report textarea {
  font: 14px var(--f-body); color: var(--text); background: var(--well); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.report textarea { resize: vertical; min-height: 84px; }
.report select:focus-visible, .report input:focus-visible, .report textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.rp-check { display: flex !important; align-items: center; gap: 8px; margin-top: 10px; color: var(--text) !important; font-size: 13px !important; }
.rp-check input { accent-color: var(--bronze); width: 16px; height: 16px; }
.report details { margin-top: 8px; font-size: 12px; color: var(--muted); }
.report summary { cursor: pointer; }
.report pre { margin: 6px 0 0; padding: 10px; border-radius: 8px; background: var(--well); border: 1px solid var(--line); color: var(--text);
  font: 11px/1.45 var(--f-mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.rp-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.rp-row .open { padding: 8px 16px; font-size: 13px; }
.rp-row .open:disabled { opacity: .6; cursor: progress; }
.rp-state { font-size: 13px; color: var(--text); }
@media (max-width: 700px) {
  .rp-grid { grid-template-columns: 1fr; }
  .head { padding: 14px 10px 4px 14px; gap: 10px; }
  .ico { width: 38px; height: 38px; }
  .title { font-size: 16px; white-space: normal; }
  .meta { margin: 2px 14px 6px 14px; font-size: 13.5px; }
  .foot { padding: 8px 12px 10px 14px; }
  .brand h1 { font-size: 22px; }
  .tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .tile, .ghost { transition: none; } }
</style>
</head>
<body>


<div class="bg-layer" id="bgLayer" hidden><img id="bgImg" alt="" hidden><video id="bgVid" muted loop playsinline autoplay hidden></video><div class="bg-dim"></div></div>
<header class="bar">
  <div class="brand">
    <div class="coin" aria-hidden="true">N</div>
    <div><h1>NERON STUDIO</h1><small id="sub"></small></div>
  </div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="tools">
    <div class="seg" id="lang" role="group"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></div>
    <button type="button" class="tool" id="themeBtn"></button>
    <button type="button" class="tool" id="align"></button>
    <button type="button" class="tool" id="add"></button>
    <button type="button" class="tool" id="reset"></button>
    <button type="button" class="tool" id="close"></button>
  </div>
</header>
<p class="hint" id="hint"></p>
<main class="desk" id="desk"></main>
<section class="report" id="report" hidden></section>
<div class="drawer" id="drawer" hidden></div>
<div class="drawer" id="themes" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const COL = {};
function readCol() {
  const css = getComputedStyle(document.documentElement), C = (n) => css.getPropertyValue(n).trim();
  Object.assign(COL, { ink: C("--ink"), bronze: C("--bronze"), gold: C("--gold"), ember: C("--ember"), text: C("--text"),
    muted: C("--muted"), ok: C("--ok"), alpha: C("--alpha"), soon: C("--soon"), line: C("--line"), well: C("--well"),
    panel2: C("--panel-2") });
}
readCol();
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- язык: по языку системы, переключатель RU | EN в полосе (выбор запоминается) ----------
const LANG_KEY = "neron-studio-lang";
let lang = (() => {
  try { const v = localStorage.getItem(LANG_KEY); if (v === "ru" || v === "en") return v; } catch (_) {}
  return /^(ru|uk|be|kk)\b/i.test(navigator.language || "") ? "ru" : "en";
})();
const tx = (v) => (Array.isArray(v) ? v[lang === "ru" ? 0 : 1] : v);
const UI = {
  sub: ["рабочий стол · ComfyUI", "desktop · ComfyUI"],
  hint: ["«Открыть папку» — войти внутрь, «‹ Назад» или Esc — выйти. Плитку можно перетащить за верх и растянуть за уголок.",
         "«Open folder» goes inside, «‹ Back» or Esc goes out. Drag a tile by its top, resize it by the corner."],
  theme: ["🎨 Тема", "🎨 Theme"], align: ["⊞ Выровнять", "⊞ Tidy up"], add: ["＋ Плитка", "＋ Tile"], reset: ["↺ Как было", "↺ Reset"],
  close: ["✕ В ComfyUI", "✕ To ComfyUI"], closeTip: ["Вернуться в ComfyUI", "Back to ComfyUI"],
  langTip: ["Язык стола", "Desktop language"], back: ["‹ Назад", "‹ Back"], path: ["Путь", "Path"],
  ok: ["готово", "ready"], alpha: ["альфа", "alpha"], soon: ["скоро", "soon"],
  open: ["Открыть →", "Open →"], openF: ["Открыть папку →", "Open folder →"], soonBtn: ["Скоро", "Soon"], missing: ["Не установлено", "Not installed"],
  removeTip: ["Убрать со стола", "Remove from the desk"], sizeTip: ["Потяни — размер", "Drag to resize"],
  tSoon: ["«%» — в планах. Плитка уже живёт на столе.", "«%» is planned. The tile already lives on the desk."],
  tOutside: ["Внутри ComfyUI эта кнопка откроет процесс «%» новой вкладкой.", "Inside ComfyUI this button opens «%» in a new tab."],
  tMissing: ["Процесс «%» не установлен. Обновите пакет Neron в Manager и перезапустите ComfyUI.", "«%» is not installed. Update the Neron pack in Manager and restart ComfyUI."],
  tOpening: ["Открываю «%»…", "Opening «%»…"],
  tRemoved: ["Плитка «%» убрана.", "Tile «%» removed."], tUndo: ["Вернуть", "Undo"],
  tAligned: ["Выровнено: плитки стоят ровной сеткой.", "Tidied up: tiles stand in an even grid."],
  tReset: ["Стол как в первый раз.", "The desk is back to the first-run layout."],
  drawerH: ["Добавить плитку", "Add a tile"], drawerP: ["Нажмите — плитка встанет на стол.", "Click — the tile goes back on the desk."],
  drawerNone: ["Все плитки этой папки уже на столе. Уберите любую ✕ — она появится здесь.", "All tiles of this folder are on the desk. Remove one with ✕ and it shows up here."],
  inFolder: ["внутри: %", "inside: %"],
};
const u = (k, arg) => tx(UI[k]).replace("%", arg ?? "");

// ---------- папки и плитки. Плитка либо открывает папку (go), либо процесс (wf). ----------
// Проверенные процессы — как есть (s: "ok"); на проверку сообществу — в папке «Тест» (s: "alpha").
const VIEWS = {
  home: { t: ["Стол", "Desktop"], tiles: [
    { id: "f-video", ico: "video", t: ["Видео", "Video"], s: "ok", go: "video", w: 4, h: 2,
      meta: ["Оживить фото, длинный ролик, диалог, движение из клипа, улучшение.",
             "Bring a photo to life, long clips, dialogue, motion from a clip, enhance."] },
    { id: "f-image", ico: "image", t: ["Картинки", "Images"], s: "ok", go: "image", w: 4, h: 2,
      meta: ["Расширить кадр, восстановить и раскрасить старое фото, повысить качество.",
             "Expand a picture, restore and colorize an old photo, raise the quality."] },
    { id: "f-audio", ico: "sound", t: ["Звук", "Sound"], s: "ok", go: "audio", w: 4, h: 2,
      meta: ["Музыка и голос, сведение дорожек, клип со звуком.",
             "Music and voice, mixing tracks, a clip with sound."] },
  ] },
  video: { up: "home", t: ["Видео", "Video"], tiles: [
    { id: "v-i2v", ico: "photo2video", t: ["Фото → видео", "Photo → video"], s: "ok", go: "i2v", w: 4, h: 2,
      meta: ["Одно фото превращается в короткое видео. Внутри три движка на выбор.",
             "One photo becomes a short video. Three engines inside to choose from."] },
    { id: "v-long", ico: "long", t: ["Длинный ролик", "Long video"], s: "ok", go: "long", w: 4, h: 2,
      meta: ["Ролик до 45 секунд из нескольких сцен, без видимых стыков.",

  slider(tx(["Затемнение фона", "Background dimming"]), "dim", 0, .85, .05, (v) => Math.round(v * 100) + "%");
  slider(tx(["Размытие фона", "Background blur"]), "blur", 0, 16, 1, (v) => v + " px");
  slider(tx(["Плитки: плотность (меньше — стекло)", "Tiles: density (lower — glass)"]), "tileop", 35, 100, 5, (v) => v + "%");
}
// перетащить файл на стол — сразу фоном
desk.addEventListener("dragover", (e) => { if ([...(e.dataTransfer?.types || [])].includes("Files")) { e.preventDefault(); desk.classList.add("drop"); } });
desk.addEventListener("dragleave", () => desk.classList.remove("drop"));
desk.addEventListener("drop", (e) => { e.preventDefault(); desk.classList.remove("drop"); bgSetFile(e.dataTransfer?.files?.[0]); });
bgApplySettings();
bgLoad().then((rec) => { if (rec) bgShow(rec); });

// ================== 🧪 «✉ Написать создателю» (папка «Тест») ==================
// Письмо уходит автору через Web3Forms (ключ публичный: он только разрешает слать письма автору, адреса не раскрывает).
// К письму — только то, что видно в «Что будет отправлено»: процесс, текст, версия ComfyUI, видеокарта, последняя ошибка.
const DESK_VERSION = "2026.11.13·3";
const W3F_KEY = "6462b9a5-e856-422f-9f27-23875a4277d3";
const SENT_KEY = "neron-studio-report-at", ERR_KEY = "neron-studio-last-error";
const RP = {
  h: ["✉ Написать создателю", "✉ Write to the author"],
  lead: ["Что-то не так или есть идея? Пару слов — остальное стол приложит сам. Письмо придёт автору Neron.",
         "Something wrong or have an idea? A few words — the desk attaches the rest. The message goes to the Neron author."],
  proc: ["Процесс", "Workflow"], other: ["Другой процесс Neron", "Another Neron workflow"], desk: ["Сам стол Neron Studio", "The Neron Studio desk itself"],
  msg: ["Что случилось / что предлагаете", "What happened / your idea"],
  msgPh: ["Например: на «Быстро» картинка двоится с 3-й секунды", "E.g.: on «Fast» the picture doubles from second 3"],
  contact: ["Как с вами связаться (необязательно)", "How to reach you (optional)"], contactPh: ["почта или Telegram", "email or Telegram"],
  attach: ["Приложить сведения о системе и последнюю ошибку", "Attach system info and the last error"],
  preview: ["Что будет отправлено", "What will be sent"],
  ipNote: ["Письмо пересылает сервис Web3Forms — он, как любой сайт, видит IP-адрес отправителя и пишет его в письмо.",
           "The message is relayed by Web3Forms — like any website it sees the sender's IP address and puts it in the message."],
  send: ["Отправить", "Send"], sending: ["Отправляю…", "Sending…"],
  ok: ["Отправлено. Спасибо — это правда помогает!", "Sent. Thank you — it really helps!"],
  empty: ["Напишите пару слов — что случилось.", "Write a few words about what happened."],
  wait: ["Чуть подождите: не чаще одного письма в минуту.", "Please wait: one message per minute at most."],
  fail: ["Не ушло: %. Проверьте интернет и попробуйте ещё раз.", "Not sent: %. Check the internet and try again."],
  noErr: ["ошибок не было", "no errors so far"], noSys: ["ComfyUI не ответил", "ComfyUI did not answer"],
};
const r = (k, a) => tx(RP[k]).replace("%", a ?? "");
const reportEl = document.getElementById("report");
let sysCache;                                             // undefined — ещё не спрашивали; null — ComfyUI не ответил
async function sysInfo() {
  if (sysCache !== undefined) return sysCache;
  sysCache = null;
  try { const res = await fetch("system_stats", { cache: "no-store" }); if (res.ok) sysCache = await res.json(); } catch (_) {}
  return sysCache;
}
function lastErr() { try { return JSON.parse(localStorage.getItem(ERR_KEY) || "null"); } catch (_) { return null; } }
const gb = (b) => (b ? (b / 1073741824).toFixed(1) + " GB" : "?");
function sysLines(st) {                                  // всегда по-русски — письмо читает автор
  if (!st) return ["ComfyUI: не ответил"];
  const s = st.system || {}, dv = (st.devices || [])[0] || {};
  return [`ComfyUI: ${s.comfyui_version || "?"} · ${s.os || "?"} · Python ${String(s.python_version || "?").split(" ")[0]}`,
          `Видеокарта: ${String(dv.name || "?").replace(/^\w+:\d+\s+/, "").replace(/\s*:\s*\w+$/, "")} · VRAM ${gb(dv.vram_total)} · ОЗУ ${gb(s.ram_total)}`];
}
function errLines(e) {
  if (!e) return ["Последняя ошибка: не было"];
  return [`Последняя ошибка: ${e.at || "?"} · процесс «${e.workflow || "?"}» · нода ${e.node || "?"} (#${e.node_id || "?"})`,
          `${e.type || ""}: ${e.message || ""}`.trim(), e.traceback ? "--- traceback ---\n" + e.traceback : ""].filter(Boolean);
}
function buildReport() {
  reportEl.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = r("h");
  const p = document.createElement("p"); p.textContent = r("lead");
  const grid = document.createElement("div"); grid.className = "rp-grid";
  const field = (label, ctl) => { const l = document.createElement("label"); const s = document.createElement("span"); s.textContent = label; l.append(s, ctl); return l; };
  const sel = document.createElement("select"); sel.id = "rpProc";
  for (const d of VIEWS.test.tiles) sel.append(new Option(tx(d.t), d.t[0]));
  sel.append(new Option(r("other"), "Другой процесс Neron"), new Option(r("desk"), "Стол Neron Studio"));
  const contact = document.createElement("input"); contact.id = "rpContact"; contact.maxLength = 120; contact.placeholder = r("contactPh"); contact.autocomplete = "email";
  grid.append(field(r("proc"), sel), field(r("contact"), contact));
  const msg = document.createElement("textarea"); msg.id = "rpMsg"; msg.rows = 4; msg.maxLength = 4000; msg.placeholder = r("msgPh");
  const msgL = field(r("msg"), msg); msgL.className = "rp-wide";
  const chk = document.createElement("label"); chk.className = "rp-check";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = true;
  const cbt = document.createElement("span"); cbt.textContent = r("attach"); chk.append(cb, cbt);
  const det = document.createElement("details"); const sum = document.createElement("summary"); sum.textContent = r("preview");
  const pre = document.createElement("pre");
  const ipn = document.createElement("p"); ipn.style.margin = "6px 0 0"; ipn.textContent = r("ipNote");
  det.append(sum, pre, ipn);
  const bot = document.createElement("input"); bot.type = "checkbox"; bot.tabIndex = -1; bot.hidden = true; bot.setAttribute("aria-hidden", "true");
  const row = document.createElement("div"); row.className = "rp-row";
  const send = document.createElement("button"); send.type = "button"; send.className = "open"; send.textContent = r("send");
  const state = document.createElement("span"); state.className = "rp-state"; state.setAttribute("role", "status");
  row.append(send, state);
  reportEl.append(h, p, grid, msgL, chk, det, bot, row);

  const body = async () => {
    const lines = [`Процесс: ${sel.value}`, `Язык стола: ${lang.toUpperCase()} · Neron Studio ${DESK_VERSION}`];
    if (contact.value.trim()) lines.push(`Контакт: ${contact.value.trim()}`);
    lines.push("", "Сообщение:", msg.value.trim() || "—");
    if (cb.checked) lines.push("", ...sysLines(await sysInfo()), "", ...errLines(lastErr()));
    return lines.join("\n");
  };
  const refresh = async () => { pre.textContent = await body(); };
  for (const el of [sel, contact, msg, cb]) el.addEventListener("input", refresh);
  det.addEventListener("toggle", refresh);
  refresh();

  send.onclick = async () => {
    if (!msg.value.trim()) { state.textContent = r("empty"); msg.focus(); return; }
    let last = 0; try { last = Number(localStorage.getItem(SENT_KEY) || 0); } catch (_) {}
    if (Date.now() - last < 60000) { state.textContent = r("wait"); return; }
    send.disabled = true; state.textContent = r("sending");
    try {
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({ access_key: W3F_KEY, subject: `Neron Studio · бета · ${sel.value}`, from_name: "Neron Studio",
          botcheck: bot.checked, message: await body() }),
      });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || out.success === false) throw new Error(out.message || ("HTTP " + res.status));
      try { localStorage.setItem(SENT_KEY, String(Date.now())); } catch (_) {}
      state.textContent = r("ok"); msg.value = ""; refresh();
    } catch (e) { state.textContent = r("fail", e?.message || e); }
    finally { send.disabled = false; }
  };
}
function showReport() {
  const on = !!VIEWS[view].report;
  reportEl.hidden = !on;
  if (on) buildReport(); else reportEl.innerHTML = "";
}

// ================== язык: подписи полосы и переключатель RU | EN ==================
function applyTexts() {
  document.documentElement.lang = lang;
  document.getElementById("sub").textContent = u("sub");
  document.getElementById("hint").textContent = u("hint");
  for (const id of ["theme", "align", "add", "reset", "close"]) {
    const el = document.getElementById(id === "theme" ? "themeBtn" : id); if (el) el.textContent = u(id);
  }
  document.getElementById("close").title = u("closeTip");
  const seg = document.getElementById("lang"); seg.setAttribute("aria-label", u("langTip")); seg.title = u("langTip");
  for (const b of seg.querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  desk.setAttribute("aria-label", tx(VIEWS[view].t));
}
function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (_) {}
  applyTexts(); drawCrumbs(); clearTiles(); render(); showReport(); applyTheme();
  if (!themesBox.hidden) fillThemes();
  if (!drawer.hidden) fillDrawer();
  try { if (parent !== window) parent.postMessage({ neronStudio: "lang", lang: l }, "*"); } catch (_) {}
}
for (const b of document.querySelectorAll("#lang button")) b.onclick = () => setLang(b.dataset.lang);
document.getElementById("close").onclick = () => { try { parent.postMessage({ neronStudio: "close" }, "*"); } catch (_) {} };
if (parent === window) document.getElementById("close").hidden = true;
applyTexts(); drawCrumbs(); showReport();

fit(); render(true);
document.fonts?.ready.then(() => render());
})();
</script>
