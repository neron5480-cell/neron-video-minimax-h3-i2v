<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neron Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: «рабочий стол» — сетка плиток 12 колонок; плитки живые (canvas), тянутся, растягиваются, удаляются,
   «⊞ Выровнять» убирает дыры. Единый тёмный мир Neron (бронза, золото аурея, угли) — одна тема намеренно. */
:root {
  --ink: #0e0a07;          /* фон стола — тёплая сажа */
  --panel: #1b130d;        /* тело плитки */
  --panel-2: #241910;      /* шапка плитки, полосы */
  --line: #3a2a1c;         /* рамки */
  --bronze: #c8873a;       /* основной акцент */
  --gold: #f0c75a;         /* золото аурея — заголовки и главное */
  --ember: #ff7a1a;        /* угли — живое, «идёт» */
  --text: #f3e6d2;
  --muted: #a8957e;
  --ok: #8fd99a;           /* готово */
  --alpha: #ffb347;        /* альфа */
  --soon: #7f8fa1;         /* скоро */
  --f-display: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --f-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --gap: 12px;
  --row: 96px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: radial-gradient(1200px 700px at 70% -10%, #2a1a0e 0%, transparent 60%) fixed, var(--ink);
  color: var(--text);
  font: 14px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 40px;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

/* ---------- верхняя полоса ---------- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.coin {
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, #fff1b8, #f0c75a 35%, #b9821f 75%, #6b4210);
  box-shadow: 0 0 22px rgba(255, 122, 26, .45), inset 0 0 0 2px rgba(107, 66, 16, .7);
  font: 700 22px var(--f-display); color: #4a2c06;
}
.brand h1 { margin: 0; font: 700 26px/1 var(--f-display); letter-spacing: .08em; color: var(--gold); text-wrap: balance; }
.brand small { display: block; font: 500 11px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.tabs { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); flex-wrap: wrap; }
.tabs button, .tool {
  font: 600 13px var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px;
  padding: 7px 12px; cursor: pointer;
}
.tabs button[aria-pressed="true"] { color: var(--ink); background: var(--bronze); }
.tools { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.tool { border: 1px solid var(--line); background: var(--panel); color: var(--text); }
.tool:hover, .tabs button:hover { color: var(--gold); }
.tabs button[aria-pressed="true"]:hover { color: var(--ink); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 12px; margin: -6px 0 14px; }

/* ---------- стол ---------- */
.desk { position: relative; width: 100%; min-height: 200px; }
.tile {
  position: absolute; display: flex; flex-direction: column; overflow: hidden;
  background: linear-gradient(180deg, var(--panel-2), var(--panel) 38%);
  border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
  transition: left .28s cubic-bezier(.2, .8, .2, 1), top .28s cubic-bezier(.2, .8, .2, 1),
              width .28s cubic-bezier(.2, .8, .2, 1), height .28s cubic-bezier(.2, .8, .2, 1), opacity .25s, filter .25s;
}
.tile.dragging, .tile.resizing { transition: none; z-index: 20; box-shadow: 0 22px 60px rgba(0, 0, 0, .7), 0 0 0 1px var(--bronze); }
.tile.dim { opacity: .22; filter: saturate(.4); }
.tile:hover { border-color: #5a3f27; }
.head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 7px 12px; cursor: grab; user-select: none; touch-action: none; }
.tile.dragging .head { cursor: grabbing; }
.ico { font-size: 16px; }
.title { font: 700 13.5px var(--f-body); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.chip { font: 600 10px var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; flex: none; }
.chip.ok { color: var(--ok); } .chip.alpha { color: var(--alpha); } .chip.soon { color: var(--soon); }
.x { flex: none; width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1; }
.x:hover { background: #3a1f17; color: #ffb4a0; }
.live { position: relative; flex: 1; min-height: 0; margin: 0 10px; border-radius: 9px; overflow: hidden; background: #0a0705; }
.live canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px 12px; min-width: 0; }
.meta { font: 400 11px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.open { flex: none; font: 600 12px var(--f-body); color: var(--ink); background: var(--bronze); border: 0; border-radius: 7px; padding: 6px 11px; cursor: pointer; }
.open:hover { background: var(--gold); }
.tile[data-status="soon"] .open { background: transparent; color: var(--soon); border: 1px solid var(--line); }
.grip { position: absolute; right: 2px; bottom: 2px; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; opacity: .55; }
.grip::before { content: ""; position: absolute; right: 4px; bottom: 4px; width: 9px; height: 9px;
  border-right: 2px solid var(--bronze); border-bottom: 2px solid var(--bronze); border-radius: 0 0 3px 0; }
.tile:hover .grip { opacity: 1; }
.ghost { position: absolute; border: 2px dashed var(--bronze); border-radius: 14px; background: rgba(200, 135, 58, .08); pointer-events: none; z-index: 1; transition: left .12s, top .12s, width .12s, height .12s; }

/* ---------- ящик «＋ Плитка» и тост ---------- */
.drawer { position: fixed; z-index: 30; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(70px + env(safe-area-inset-top, 0px));
  width: min(340px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; padding: 14px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--bronze); box-shadow: 0 20px 60px rgba(0, 0, 0, .7); }
.drawer h2 { margin: 0 0 4px; font: 700 18px var(--f-display); color: var(--gold); letter-spacing: .06em; }
.drawer p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
.drawer button.item { display: flex; width: 100%; gap: 10px; align-items: center; text-align: left; padding: 9px 10px; margin-top: 6px;
  border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font: 500 13px var(--f-body); cursor: pointer; }
.drawer button.item:hover { border-color: var(--bronze); }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: #2a1c12; border: 1px solid var(--bronze);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .6); font-size: 13px; max-width: calc(100vw - 32px); }
.toast button { font: 600 12px var(--f-body); background: var(--bronze); color: var(--ink); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
@media (max-width: 700px) {
  .brand h1 { font-size: 22px; }
  .tools { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .tile, .ghost { transition: none; } }
</style>
</head>
<body>


<header class="bar">
  <div class="brand">
    <div class="coin" aria-hidden="true">N</div>
    <div><h1>NERON STUDIO</h1><small>рабочий стол · desktop · ComfyUI</small></div>
  </div>
  <nav class="tabs" aria-label="Разделы">
    <button type="button" data-tab="all" aria-pressed="true">Все</button>
    <button type="button" data-tab="image" aria-pressed="false">Изображения</button>
    <button type="button" data-tab="video" aria-pressed="false">Видео</button>
    <button type="button" data-tab="audio" aria-pressed="false">Аудио</button>
  </nav>
  <div class="tools">
    <button type="button" class="tool" id="align">⊞ Выровнять</button>
    <button type="button" class="tool" id="add">＋ Плитка</button>
    <button type="button" class="tool" id="reset">↺ Как было</button>
    <button type="button" class="tool" id="close" title="Вернуться в ComfyUI">✕ В ComfyUI</button>
  </div>
</header>
<p class="hint">Тяните плитку за шапку, размер — за уголок, ✕ — убрать. «⊞ Выровнять» сдвигает всё без дыр. Прототип: кнопки «Открыть» пока только показывают, какой процесс откроется.</p>
<main class="desk" id="desk" aria-label="Плитки процессов"></main>
<div class="drawer" id="drawer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const css = getComputedStyle(document.documentElement);
const C = (n) => css.getPropertyValue(n).trim();
const COL = { ink: C("--ink"), bronze: C("--bronze"), gold: C("--gold"), ember: C("--ember"), text: C("--text"),
              muted: C("--muted"), ok: C("--ok"), alpha: C("--alpha"), soon: C("--soon"), line: C("--line") };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- плитки: что есть у Neron сегодня (готово), что в работе (альфа), что будет (скоро) ----------
const TILES = [
  { id: "one", ico: "🎬", t: "Генератор видео · H3 One", k: "video", s: "ok", meta: "5 режимов · Экстрим → Максимум", paint: "film", x: 0, y: 0, w: 4, h: 3 },
  { id: "story", ico: "🎞", t: "Длинный ролик · H3 Story", k: "video", s: "ok", meta: "до 45 с · блоки без стыков", paint: "chain", x: 4, y: 0, w: 5, h: 2 },
  { id: "timing", ico: "⏱", t: "Последний замер", k: "video", s: "ok", meta: "H3 One · 🚀 Быстро · 768×768 · 5 с", paint: "timing", x: 9, y: 0, w: 3, h: 3 },
  { id: "swap", ico: "🎭", t: "Замена героя", k: "video", s: "alpha", meta: "видео + фото «на кого»", paint: "swap", x: 4, y: 2, w: 3, h: 2 },
  { id: "clarity", ico: "✨", t: "Улучшение видео", k: "video", s: "ok", meta: "Perception Relay · Clarity", paint: "split", x: 7, y: 2, w: 2, h: 2 },
  { id: "audio", ico: "🎵", t: "Audio Studio · DJ Pult", k: "audio", s: "ok", meta: "звук, музыка, сведение", paint: "eq", x: 0, y: 3, w: 4, h: 2 },
  { id: "restore", ico: "🎨", t: "Реставрация и раскраска", k: "image", s: "ok", meta: "Restore Studio · DDColor · CodeFormer", paint: "colorize", x: 9, y: 3, w: 3, h: 2 },
  { id: "outpaint", ico: "↔", t: "Расширение изображения", k: "image", s: "ok", meta: "Flux Fill · до любого размера", paint: "outpaint", x: 4, y: 4, w: 3, h: 2 },
  { id: "upscale", ico: "🔍", t: "Улучшить качество", k: "image", s: "ok", meta: "апскейл · лица · шумодав", paint: "loupe", x: 7, y: 4, w: 2, h: 2 },
  { id: "imagegen", ico: "🖼", t: "Генератор кадра", k: "image", s: "soon", meta: "p-h3-image · текст + образцы", paint: "forming", x: 0, y: 5, w: 3, h: 2 },
  { id: "edit", ico: "✏", t: "Редактор словами", k: "image", s: "soon", meta: "«надень юбку с картинки 2»", paint: "typing", x: 9, y: 5, w: 3, h: 2 },
  { id: "tryon", ico: "👗", t: "Примерочная", k: "image", s: "soon", meta: "фото человека + вещь", paint: "tryon", x: 3, y: 6, w: 3, h: 2 },
  { id: "cutout", ico: "✂", t: "Удаление фона", k: "image", s: "soon", meta: "PNG с прозрачным фоном", paint: "cutout", x: 6, y: 6, w: 3, h: 2 },
  { id: "models", ico: "📥", t: "Модели", k: "all", s: "ok", meta: "качает сама · докачка с обрыва", paint: "models", x: 0, y: 7, w: 3, h: 2 },
];
const BY_ID = Object.fromEntries(TILES.map((d) => [d.id, d]));
const STATUS = { ok: "готово", alpha: "альфа", soon: "скоро" };
const KEY = "neron-studio-layout-v1";

// ---------- раскладка ----------
let cols = 12;
let layout = defaults();
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved && Array.isArray(saved.items)) layout = saved.items.filter((it) => BY_ID[it.id]);
} catch (_) {}
function defaults() { return TILES.map(({ id, x, y, w, h }) => ({ id, x, y, w, h })); }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ items: layout })); } catch (_) {} }

const desk = document.getElementById("desk");
const els = new Map();
let tab = "all";

function geom() {
  const W = desk.clientWidth, gap = 12, row = innerWidth < 700 ? 84 : 96;
  const cw = (W - gap * (cols - 1)) / cols;
  return { W, gap, row, cw, sx: cw + gap, sy: row + gap };
}
function px(it) {
  const g = geom();
  return { left: it.x * g.sx, top: it.y * g.sy, width: it.w * g.cw + (it.w - 1) * g.gap, height: it.h * g.row + (it.h - 1) * g.gap };
}
const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

// Сначала ставим «главную» плитку (которую тянут), остальные — на своё место или ниже, если занято.
function settle(first) {
  const placed = [];
  const order = layout.filter((it) => it !== first).sort((a, b) => a.y - b.y || a.x - b.x);
  for (const it of (first ? [first] : []).concat(order)) {
    it.w = Math.min(it.w, cols); it.x = Math.max(0, Math.min(it.x, cols - it.w)); it.y = Math.max(0, it.y);
    while (placed.some((p) => hit(p, it))) it.y++;
    placed.push(it);
  }
}
// «⊞ Выровнять»: каждую плитку — как можно выше, без дыр.
function compact() {
  const placed = [];
  for (const it of [...layout].sort((a, b) => a.y - b.y || a.x - b.x)) {
    it.w = Math.min(it.w, cols); it.x = Math.max(0, Math.min(it.x, cols - it.w));
    it.y = 0;
    while (placed.some((p) => hit(p, it))) it.y++;
    placed.push(it);
  }
}
function render() {
  const g = geom();
  let bottom = 0;
  for (const it of layout) {
    const el = els.get(it.id) || make(it);
    if (!el.classList.contains("dragging") && !el.classList.contains("resizing")) {
      const p = px(it);
      Object.assign(el.style, { left: p.left + "px", top: p.top + "px", width: p.width + "px", height: p.height + "px" });
    }
    const d = BY_ID[it.id];
    el.classList.toggle("dim", tab !== "all" && d.k !== tab && d.k !== "all");
    bottom = Math.max(bottom, (it.y + it.h) * g.sy);
  }
  for (const [id, el] of els) if (!layout.find((it) => it.id === id)) { el.remove(); els.delete(id); }
  desk.style.height = bottom + "px";
}

// ---------- плитка ----------
function make(it) {
  const d = BY_ID[it.id];
  const el = document.createElement("section");
  el.className = "tile"; el.dataset.status = d.s; el.dataset.id = d.id;
  el.setAttribute("aria-label", d.t);
  el.innerHTML = `<div class="head"><span class="ico" aria-hidden="true">${d.ico}</span><span class="title">${d.t}</span>
    <span class="chip ${d.s}">${STATUS[d.s]}</span><button class="x" type="button" title="Убрать со стола" aria-label="Убрать ${d.t}">✕</button></div>
    <div class="live"><canvas></canvas></div>
    <div class="foot"><span class="meta">${d.meta}</span><button class="open" type="button">${d.s === "soon" ? "Скоро" : "Открыть"}</button></div>
    <div class="grip" title="Потяни — размер" aria-hidden="true"></div>`;
  el.querySelector(".x").onclick = () => removeTile(d.id);
  el.querySelector(".open").onclick = () => toast(d.s === "soon"
    ? `«${d.t}» — в планах. Плитка уже живёт на столе.`
    : `Откроется процесс «${d.t}» со всеми настройками (в Studio — внутри ComfyUI).`);
  dragOn(el.querySelector(".head"), it, el, "move");
  dragOn(el.querySelector(".grip"), it, el, "size");
  desk.append(el);
  els.set(it.id, el);
  painters.push({ el, canvas: el.querySelector("canvas"), fn: PAINT[d.paint], id: d.id });
  return el;
}

// ---------- перетаскивание и размер (мышь, палец, перо) ----------
let ghost = null;
function dragOn(handle, it0, el, mode) {
  handle.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || e.target.closest("button")) return;
    e.preventDefault();
    const it = layout.find((x) => x.id === it0.id);
    const g = geom(), r = el.getBoundingClientRect(), dr = desk.getBoundingClientRect();
    const start = { x: e.clientX, y: e.clientY, left: r.left - dr.left, top: r.top - dr.top, w: r.width, h: r.height };
    el.classList.add(mode === "move" ? "dragging" : "resizing");
    handle.setPointerCapture(e.pointerId);
    ghost = document.createElement("div"); ghost.className = "ghost"; desk.append(ghost);
    const moveGhost = () => { const p = px(it); Object.assign(ghost.style, { left: p.left + "px", top: p.top + "px", width: p.width + "px", height: p.height + "px" }); };
    moveGhost();
    const onMove = (ev) => {
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (mode === "move") {
        el.style.left = start.left + dx + "px"; el.style.top = Math.max(0, start.top + dy) + "px";
        it.x = Math.round((start.left + dx) / g.sx); it.y = Math.max(0, Math.round((start.top + dy) / g.sy));
      } else {
        const w = Math.max(160, start.w + dx), h = Math.max(150, start.h + dy);
        el.style.width = w + "px"; el.style.height = h + "px";
        it.w = Math.max(2, Math.min(cols, Math.round((w + g.gap) / g.sx))); it.h = Math.max(2, Math.min(6, Math.round((h + g.gap) / g.sy)));
      }
      settle(it); moveGhost(); render();
    };
    const onUp = () => {
      handle.removeEventListener("pointermove", onMove);
      el.classList.remove("dragging", "resizing");
      ghost?.remove(); ghost = null;
      settle(it); render(); save();
    };
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp, { once: true });
    handle.addEventListener("pointercancel", onUp, { once: true });
  });
}

// ---------- удалить / вернуть / ящик ----------
let lastRemoved = null;
function removeTile(id) {
  const i = layout.findIndex((it) => it.id === id);
  if (i < 0) return;
  lastRemoved = layout.splice(i, 1)[0];
  painters = painters.filter((p) => p.id !== id);
  render(); save(); fillDrawer();
  toast(`Плитка «${BY_ID[id].t}» убрана.`, "Вернуть", () => restore(lastRemoved));
}
function restore(it) {
  if (!it || layout.find((x) => x.id === it.id)) return;
  layout.push({ ...it }); settle(layout[layout.length - 1]); render(); save(); fillDrawer();
}
const drawer = document.getElementById("drawer");
function fillDrawer() {
  const off = TILES.filter((d) => !layout.find((it) => it.id === d.id));
  drawer.innerHTML = `<h2>Добавить плитку</h2><p>${off.length ? "Нажмите — плитка встанет на стол." : "Все плитки уже на столе. Уберите любую ✕ — она появится здесь."}</p>`;
  for (const d of off) {
    const b = document.createElement("button"); b.type = "button"; b.className = "item";
    b.innerHTML = `<span aria-hidden="true">${d.ico}</span><span>${d.t}</span>`;
    b.onclick = () => { const def = TILES.find((t) => t.id === d.id); restore({ id: d.id, x: 0, y: 0, w: def.w, h: def.h }); };
    drawer.append(b);
  }
}
document.getElementById("add").onclick = () => { fillDrawer(); drawer.hidden = !drawer.hidden; };
